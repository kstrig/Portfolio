.bth{width:70px;height:100px;flex:0 0 70px!important;border-radius:4px 8px 8px 4px;background:var(--mist) center/cover;display:grid;place-items:center;font-size:28px;box-shadow:-3px 4px 10px rgba(0,0,0,.25)}
.hn{font-size:13px;color:var(--mute)}.emp{color:var(--mute);text-align:center;padding:20px}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin:14px 0}.stc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}.stc b{display:block;font:600 32px 'DM Sans',sans-serif}.stc span{color:var(--mute);font-size:14px}

.mus{position:absolute;left:auto;right:3%;bottom:9%;transform:none;width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.mus:not(.on){animation:ring 2.4s infinite}.mus.on{background:var(--clay);color:#fff;border-color:var(--clay);box-shadow:none;animation:none}.mus:active{transform:scale(.94)}.mus svg{width:20px;height:20px}.mus.on svg{animation:pls 1.2s ease-in-out infinite alternate}
.hero{padding-bottom:0}
.cls{max-width:780px}@media(min-width:700px){.cls{grid-template-columns:1fr 1fr}.cls .btn{grid-column:1/-1}}
.cls .cm p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.cls .btn{width:auto;justify-self:center;padding:12px 24px;border-radius:999px}
#cmo{position:fixed;inset:0;z-index:70;background:rgba(10,8,6,.8);display:flex;align-items:flex-end;justify-content:center}.cbx{background:var(--bg);width:min(620px,100%);max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;display:grid;gap:12px;align-content:start}.cbx .rw button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--ink);cursor:pointer}
.ft{margin-top:80px;background:var(--card);border-top:1px solid var(--line);padding:46px 24px 26px;color:var(--ink)}.ft .fi{max-width:760px;margin:auto;text-align:center;display:grid;gap:16px;justify-items:center}.ft .wm{font-size:22px}.ft .ftag{color:var(--mute);font:italic 15px 'Playfair Display','Hind Siliguri',serif}
.fs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.fa{display:grid;justify-items:center;gap:6px;color:var(--ink);text-decoration:none;font-size:12px;color:var(--mute);width:64px}.fa i{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-style:normal;transition:.25s}.fa i svg{width:21px;height:21px}.fa i b{font:600 17px 'DM Sans',sans-serif}.fa:hover i{background:var(--clay);color:#fff;border-color:var(--clay);transform:translateY(-3px)}
.fn{display:flex;gap:6px 22px;flex-wrap:wrap;justify-content:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase}.fn a{color:var(--mute);text-decoration:none}.fn a:hover{color:var(--ink)}
.fb2{max-width:760px;margin:30px auto 0;padding-top:18px;border-top:1px solid var(--line);text-align:center;color:var(--mute);font-size:13px}
#sp{position:fixed;top:0;left:0;height:3px;width:0;background:var(--clay);z-index:60;pointer-events:none}#tp{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:.3s}#tp.on{opacity:1;pointer-events:auto}
@supports(animation-timeline:view()){h2.serif,.gal,.tl,.th,.vg,.ag,.shelf,.lkg,.about,.cmf,.cls{animation:rvl linear both;animation-timeline:view();animation-range:entry 0% entry 35%}@keyframes rvl{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}}

h2.serif,.gal,.tl,.th,.vg,.ag,.shelf,.lkg,.about,.cmf,.cls{animation:none!important}#tp{display:none!important}
nav{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--bg)!important}.spin,.tr{will-change:transform}.mus:not(.on){animation:none!important}
.fb2 #lock{opacity:.9!important;font-size:13px!important;border:1px solid var(--line)!important;border-radius:999px;padding:5px 14px;color:var(--mute);margin-left:10px}
.fb2 #lock{border:0!important;padding:0!important;margin:0!important;border-radius:0!important;background:none!important;display:inline!important;color:var(--mute);font-size:inherit!important;cursor:default;-webkit-tap-highlight-color:transparent;user-select:none}</style></head><body>

ার পরে জানো মনটাই পাল্টে যায় কেমন যেন অদ্ভুত মনে হয় নীরবতা কিছু একটা হয়তো পাই নাই না পাওয়ার গল্প নিযুক্ত একদম এই ইউনিক হবে প্রতিটি বাধ্য প্রতিটি সাউন্ডটা যেন দিলে যে আটকে","উত্তর এখনও আসেনি, তাই স্কিল লিখছি না। ধাপ ১-এর বাকি মাপগুলো শেষ করছি: এক্সিট, পিল অদলবদল, প্রশ্ন সিন, অডিট সিন ও আউট্রো।","Saif ","একসাথে অনেকগুলো ডিলিট বা পিন করতে অথবা ইচ্ছানুযায়ী নতুন ক্লিপ যোগ করতে \"Manage\" বাটনে চাপুন"]}],"comments":[{"id":"98hm0fwt77fa69riopuf","n":"rakib","m":"❤️❤️❤️","r":0,"t":1792818426735},{"id":"e57hvg3i1im0fhu66dzk","n":"Sakib","m":"ভালে","r":5,"t":1792765517122}],"msgs":["ঠাস! 💥","ওরে বাবা! আমার হাত!","আবার আসছি 😎","প্লিজ আর না! 🥲","আমি তো শুধু নাচছিলাম...","ভূত নই, পুতুল! 👻","এই! লাগে তো! 😂","আমি পুতুল, পাঞ্চিং ব্যাগ না! 🥊","এবার কিন্তু বেতন চাইব 💸","আমাকে ফাটিয়ে কী পাও বলো তো? 🤨","ডাক্তার ডাকো, আমার কোমর গেছে 🤕","হাসতে হাসতে মরে যাব... আবার জন্ম নেব 😆","শুধু ক্লিক করলেই হবে? চা খাওয়াবে না? ☕"],"links":[],"audios":[]}</script>
